<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    setTimeout(function(){   //----takes time given for ex-2sec then it will execute the code
        console.log("prakriti"); 
    },2000) 

    const sayprakriti = function(){
        console.log("prakriti");
    }
    setTimeout(sayprakriti,2000)



    const changeText = function(){
      document.querySelector('h1').//change the h1 tag at the top of this code
      innerHTML = "best js series"
    
    }
    // setTimeout(changeText , 2000)


    const changeMe = setTimeout(changeText,2000)
    document.querySelector('#stop').addEventListener('click',function(){
        clearTimeout(changeMe)
        console.log("STOPPED")
    })
   
</script>
</html>
